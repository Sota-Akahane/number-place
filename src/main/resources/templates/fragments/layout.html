<html xmlns:th="http://www.thymeleaf.org">

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Newsreader:opsz,ital,wght@6..72,0,400;6..72,0,500;6..72,0,600;6..72,0,700;6..72,1,400;6..72,1,500&display=swap"
    />

    <link rel="stylesheet" th:href="@{/css/tokens.css}" />
    <link rel="stylesheet" th:href="@{/css/base.css}" />
    <link
      th:if="${extraCss}"
      rel="stylesheet"
      th:href="@{'/css/' + ${extraCss} + '.css'}"
    />
  </head>
</html>
